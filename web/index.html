    <script>
      // Same "theme" key the previous version of the app used, so existing preferences carry over.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var el = document.documentElement;
          el.dataset.theme = t;
          el.classList.toggle("dark", t === "dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0d0d0c" : "#f6f4ef");
        } catch (e) {}
      })();
    </script>
